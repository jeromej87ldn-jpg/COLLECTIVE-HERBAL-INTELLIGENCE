<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbadex - Herb Catalog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .filter-btn {
            padding: 10px 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
        }

        .herbs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .herb-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .herb-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        .herb-card.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .herb-id {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-bottom: 8px;
        }

        .herb-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .herb-latin {
            font-style: italic;
            color: #666;
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .herb-tradition {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #555;
            margin-bottom: 12px;
        }

        .herb-summary {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .select-btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .select-btn:hover {
            background: #764ba2;
        }

        .herb-card.selected .select-btn {
            background: #764ba2;
        }

        .action-bar {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
        }

        .selected-count {
            font-weight: bold;
            color: #333;
            flex: 1;
        }

        .action-btn {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #f0f0f0;
            color: #333;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }

        .stats {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌿 Herbadex</h1>
            <p class="subtitle">Select herbs to generate detailed profiles</p>
        </header>

        <div class="stats" id="stats"></div>

        <div class="search-section">
            <input 
                type="text" 
                class="search-box" 
                id="searchInput" 
                placeholder="Search herbs by name, Latin name, or benefits..."
            >
            <div class="filters" id="filterContainer"></div>
        </div>

        <div class="herbs-grid" id="herbsContainer">
            <div class="loading">Loading herb catalog...</div>
        </div>

        <div class="action-bar">
            <div class="selected-count" id="selectedCount">No herbs selected</div>
            <button class="action-btn clear-btn" id="clearBtn" style="display: none;">Clear Selection</button>
            <button class="action-btn generate-btn" id="generateBtn" disabled>Generate Profile</button>
        </div>
    </div>

    <script>
        let herbs = [];
        let selectedHerb = null;
        let traditions = new Set();

        // Load catalog
        async function loadCatalog() {
            try {
                const response = await fetch('herbadex_master_catalog.json');
                const data = await response.json();
                herbs = data.herbs;

                // Extract unique traditions
                herbs.forEach(herb => {
                    traditions.add(herb.tradition);
                });

                renderCatalog();
                renderFilters();
                updateStats();
            } catch (error) {
                console.error('Error loading catalog:', error);
                document.getElementById('herbsContainer').innerHTML = 
                    '<div class="empty-state">Error loading herb catalog. Please refresh the page.</div>';
            }
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            const sortedTraditions = Array.from(traditions).sort();
            
            container.innerHTML = sortedTraditions.map(tradition => 
                `<button class="filter-btn" data-tradition="${tradition}">${tradition}</button>`
            ).join('');

            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    btn.classList.toggle('active');
                    filterAndRender();
                });
            });
        }

        function filterAndRender() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const activeTraditions = Array.from(
                document.querySelectorAll('.filter-btn.active')
            ).map(btn => btn.dataset.tradition);

            const filtered = herbs.filter(herb => {
                const matchesSearch = 
                    herb.name.toLowerCase().includes(searchTerm) ||
                    herb.latin_name.toLowerCase().includes(searchTerm) ||
                    herb.summary.toLowerCase().includes(searchTerm);

                const matchesTradition = activeTraditions.length === 0 || 
                    activeTraditions.includes(herb.tradition);

                return matchesSearch && matchesTradition;
            });

            renderHerbsList(filtered);
        }

        function renderCatalog() {
            renderHerbsList(herbs);
        }

        function renderHerbsList(herbList) {
            const container = document.getElementById('herbsContainer');
            
            if (herbList.length === 0) {
                container.innerHTML = '<div class="empty-state">No herbs found matching your search.</div>';
                return;
            }

            container.innerHTML = herbList.map(herb => `
                <div class="herb-card ${selectedHerb?.id === herb.id ? 'selected' : ''}" data-id="${herb.id}">
                    <div class="herb-id">#${herb.id}</div>
                    <div class="herb-name">${herb.name}</div>
                    <div class="herb-latin">${herb.latin_name}</div>
                    <div class="herb-tradition">${herb.tradition}</div>
                    <div class="herb-summary">${herb.summary}</div>
                    <button class="select-btn" onclick="selectHerb(${herb.id}, event)">
                        ${selectedHerb?.id === herb.id ? '✓ Selected' : 'Select'}
                    </button>
                </div>
            `).join('');
        }

        function selectHerb(herbId, event) {
            event.stopPropagation();
            const herb = herbs.find(h => h.id === herbId);
            selectedHerb = selectedHerb?.id === herbId ? null : herb;
            filterAndRender();
            updateActionBar();
        }

        function updateActionBar() {
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const selectedCount = document.getElementById('selectedCount');

            if (selectedHerb) {
                selectedCount.textContent = `Selected: ${selectedHerb.name}`;
                generateBtn.disabled = false;
                clearBtn.style.display = 'block';
            } else {
                selectedCount.textContent = 'No herbs selected';
                generateBtn.disabled = true;
                clearBtn.style.display = 'none';
            }
        }

        function updateStats() {
            const stats = document.getElementById('stats');
            stats.textContent = `📚 ${herbs.length} herbs available • ${traditions.size} traditions represented`;
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterAndRender);
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            selectedHerb = null;
            filterAndRender();
            updateActionBar();
        });

        document.getElementById('generateBtn').addEventListener('click', () => {
            if (selectedHerb) {
                // Navigate to herb profile with ID
                window.location.href = `herb-profile.html?id=${selectedHerb.id}`;
            }
        });

        // Initialize
        loadCatalog();
    </script>
</body>
</html>
